<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="blog writing@JIE 写作工作台介绍图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fbfe"/>
      <stop offset="100%" stop-color="#e7eef9"/>
    </linearGradient>
    <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEBB4A"/>
      <stop offset="100%" stop-color="#F2761B"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38a8ee"/>
      <stop offset="100%" stop-color="#0e86d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#334155" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="22" fill="url(#bg)"/>
  <circle cx="1120" cy="-30" r="180" fill="#dbeafe" opacity="0.45"/>
  <circle cx="70" cy="410" r="120" fill="#fde8c8" opacity="0.35"/>

  <!-- ============ 左：项目标识 ============ -->
  <g transform="translate(62 56)">
    <!-- 胡萝卜 -->
    <path d="M22 10 Q10 -2 2 3" stroke="#68A848" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M22 10 Q33 -3 42 1" stroke="#45873D" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M22 9 C31 12 36 22 33 32 C30 42 20 51 12 50 C6 49 3 42 6 33 C9 22 14 13 22 9 Z" fill="url(#carrot)"/>
    <path d="M13 30 L28 24 M12 38 L24 32" stroke="#fff" stroke-width="2" opacity="0.35" stroke-linecap="round"/>
  </g>

  <text x="118" y="92" font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="31" font-weight="700" fill="#0f172a" letter-spacing="-0.5">blog writing@JIE</text>
  <text x="62" y="146" font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="16" fill="#334155">为 box.yangjie.site 写的专用写作工作台</text>
  <text x="62" y="172" font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#64748b">左边写 Markdown 与 MDC，右边就是博客文章的样子</text>

  <!-- 能力标签 -->
  <g font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#0e86d0">
    <rect x="62" y="196" width="86" height="30" rx="15" fill="#fff" stroke="#bfdbfe"/>
    <text x="105" y="216" text-anchor="middle">真渲染</text>
    <rect x="156" y="196" width="86" height="30" rx="15" fill="#fff" stroke="#bfdbfe"/>
    <text x="199" y="216" text-anchor="middle">文章库</text>
    <rect x="250" y="196" width="98" height="30" rx="15" fill="#fff" stroke="#bfdbfe"/>
    <text x="299" y="216" text-anchor="middle">深色模式</text>
  </g>

  <!-- 流程 -->
  <g font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="12.5" fill="#475569">
    <text x="62" y="272">Markdown</text>
    <path d="M132 267 L152 267 M147 262 L152 267 L147 272" stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="160" y="272" fill="#0e86d0" font-weight="600">同款 MDC 渲染</text>
    <path d="M262 267 L282 267 M277 262 L282 267 L277 272" stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="290" y="272">.md 导出</text>
  </g>

  <text x="62" y="326" font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="12.5" fill="#64748b">启发自 stellar-writing · 预览复用博客的组件与样式</text>
  <rect x="62" y="346" width="290" height="34" rx="9" fill="#fff" stroke="#e2e8f0"/>
  <text x="76" y="368" font-family="system-ui,-apple-system,Segoe UI,Microsoft YaHei,sans-serif" font-size="13" fill="#0e86d0" font-weight="600">https://edit.yangjie.site</text>

